<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mark — the README identity layer</title>
<meta name="description" content="One URL. One image. Your brand. Grammar-first SVG mark studio: hero, pill, strip, identity, deploy." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#07080c; --panel:#0c0f15; --elev:#131821; --fg:#f2f4f8; --muted:#8b93a7;
    --faint:#5c6478; --line:rgba(255,255,255,0.07); --line2:rgba(255,255,255,0.13);
    --accent:#e08712; --accent2:#5b9dff; --ok:#3dd68c; --radius:16px;
    --font:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --scroll:rgba(255,255,255,0.14);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  html { overflow-x:clip; }
  body {
    margin:0; color:var(--fg); font-family:var(--font); overflow:hidden;
    background:
      radial-gradient(1000px 520px at 8% -15%, rgba(224,135,18,0.13), transparent 55%),
      radial-gradient(900px 480px at 95% 0%, rgba(91,157,255,0.1), transparent 50%),
      var(--bg);
  }
  button,input,select,textarea { font:inherit; color:inherit; }
  a { color:#8ec0ff; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .scroll { scrollbar-width:thin; scrollbar-color:var(--scroll) transparent; }
  .scroll::-webkit-scrollbar { width:8px; height:8px; }
  .scroll::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:99px; }
  .app { height:100%; max-width:1360px; margin:0 auto; padding:.75rem 1rem;
    display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:.55rem; min-width:0; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:.75rem; min-width:0; }
  .brand { display:flex; align-items:center; gap:.55rem; font-weight:600; letter-spacing:-0.02em; }
  .logo { width:26px; height:26px; border-radius:8px; flex-shrink:0;
    background:linear-gradient(135deg,#e08712,#5b9dff); box-shadow:0 6px 18px rgba(224,135,18,0.28); }
  .live { display:inline-flex; align-items:center; gap:.4rem; font-size:.75rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:.28rem .65rem; background:rgba(255,255,255,0.02); }
  .live i { width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); font-style:normal; }
  .forms { display:flex; flex-wrap:nowrap; gap:.25rem; padding:.22rem; border:1px solid var(--line);
    border-radius:12px; background:rgba(255,255,255,0.02); width:fit-content; max-width:100%; overflow-x:auto; }
  .forms button { border:0; background:transparent; color:var(--muted); padding:.45rem .8rem;
    border-radius:9px; cursor:pointer; font-weight:500; font-size:.84rem; white-space:nowrap;
    transition:background .12s,color .12s; }
  .forms button:hover { color:var(--fg); }
  .forms button.active { background:var(--elev); color:var(--fg); box-shadow:inset 0 0 0 1px var(--line2); }
  .studio { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,420px);
    gap:.75rem; min-height:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  .controls { overflow-y:auto; padding:1rem; gap:1rem; display:flex; flex-direction:column; }
  .group h3 { margin:0 0 .5rem; font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:600; }
  .field { margin-bottom:.6rem; }
  .field label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.28rem; }
  .field input[type=text], .field input[type=number], .field textarea, .field select {
    width:100%; background:var(--elev); border:1px solid var(--line2); border-radius:9px;
    padding:.42rem .6rem; font-size:.85rem; color:var(--fg); }
  .field textarea { min-height:56px; resize:vertical; }
  .field input[type=checkbox] { accent-color:var(--accent); }
  .row { display:flex; gap:.5rem; }
  .row .field { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:.3rem; }
  .chip { border:1px solid var(--line2); background:var(--elev); color:var(--muted);
    padding:.3rem .6rem; border-radius:8px; font-size:.76rem; cursor:pointer; }
  .chip.on { border-color:var(--accent); color:var(--fg); box-shadow:inset 0 0 0 1px var(--accent); }
  .theme { display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line2);
    background:var(--elev); color:var(--muted); padding:.28rem .55rem; border-radius:8px; font-size:.76rem; cursor:pointer; }
  .theme.on { border-color:var(--line2); color:var(--fg); background:rgba(255,255,255,0.04); }
  .theme .orb { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .preview { flex:1; display:flex; align-items:center; justify-content:center; padding:1rem; min-height:0; }
  .preview img { max-width:100%; max-height:100%; border-radius:12px; background:repeating-conic-gradient(#10131a 0 25%, #0b0e14 0 50%) 0 0/18px 18px; }
  .copy { display:flex; gap:.5rem; align-items:center; border-top:1px solid var(--line); padding:.7rem 1rem; }
  .copy input { flex:1; background:var(--elev); border:1px solid var(--line2); border-radius:9px;
    padding:.4rem .6rem; font-family:var(--mono); font-size:.72rem; color:var(--muted); }
  .copy button { background:var(--accent); color:#fff; border:0; border-radius:9px; padding:.42rem .9rem;
    font-weight:600; font-size:.8rem; cursor:pointer; }
  .copy button:active { transform:translateY(1px); }
  .foot { font-size:.72rem; color:var(--faint); display:flex; gap:1rem; justify-content:space-between; flex-wrap:wrap; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo"></div> Mark</div>
    <div class="live"><i></i> mark.sylphx.com · grammar-first</div>
  </div>
  <div class="forms" id="forms"></div>
  <div class="studio">
    <div class="panel">
      <div class="controls scroll" id="controls"></div>
    </div>
    <div class="panel">
      <div class="preview" id="preview"><img id="previewImg" alt="mark preview" /></div>
      <div class="copy">
        <input id="urlBox" readonly spellcheck="false" />
        <button id="copyBtn" type="button">Copy URL</button>
      </div>
    </div>
  </div>
  <div class="foot">
    <span>One URL · one image · deterministic forever — no live data, no clock, no account.</span>
    <span id="baseLine"></span>
  </div>
</div>
<script>
const BASE = document.body.dataset.base || "{{BASE}}";
const FORMS = ["hero","pill","strip","identity","deploy"];
const THEMES = ["","sylphx","cubeage","epiow","ozyrix","kyle","dark","light","tokyonight","dracula","nord","neon","ocean","sunset","forest","github","radical","gruvbox","monokai"];
const ART = ["aurora","wave","waving","soft","rounded","rect","slice","glass","product","terminal","mesh","plasma","holo","neon","liquid","silk","orbit","constellation","grid","blur","ring","circuit","hud","pulse","noise","cylinder","checkered","egg","shark","venom","speech","org","transparent"];
const LAYOUTS = ["default","plate","signal","terminal"];
const ANIMS = ["none","ambient","fade","rise","scale","float","glow","breathe","slide","cascade","shimmer","glitch","wave","orbit","neon","bounce","type"];
const STYLES = ["flat","plastic","for-the-badge","social","pill"];
const BRANDS = ["sylphx","cubeage","epiow","ozyrix","kyle"];
const ICONS = ["rust","go","ts","js","python","react","node","docker","kubernetes","linux","git","github","postgres","redis","aws","gcp","azure","nextjs","vue","svelte","bun","deno","css","html","graphql","tailwind","prisma","sqlite","nginx","cloudflare","vercel","sylphx"];
const RANDOM_PALETTES = ["667EEA,764BA2","4FACFE,00F2FE","43E97B,38F9D7","FA709A,FEE140","FF6B35,F15BB5","7C3AED,00F5D4","E03840,FF6B35","00F5D4,F15BB5","4338CA,F093FB","0EA5E9,A78BFA","F43F5E,FB923C","14B8A6,6366F1","D87000,4A90E2"];

const state = {
  form:"hero", color:"", theme:"sylphx", type:"wave", layout:"default", animation:"none",
  text:"Ship your next release", desc:"Multi-color art for your README", height:220, width:880,
  credit:false,
  pill:{label:"build", message:"passing", style:"flat"},
  strip:{icons:["rust","ts","docker","kubernetes"], perline:12},
  identity:{brand:"sylphx", tagline:""},
  deploy:{service:"mark"}
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function buildURL(){
  const s = state, q = new URLSearchParams();
  if (s.theme) q.set("theme", s.theme);
  if (s.color) q.set("color", s.color);
  if (s.animation && s.animation !== "none") q.set("animation", s.animation);
  if (s.credit) q.set("credit", "1");
  if (s.form === "hero") {
    if (s.type) q.set("type", s.type);
    if (s.layout && s.layout !== "default") q.set("layout", s.layout);
    if (s.text) q.set("text", s.text.replace(/\n/g, "-nl-"));
    if (s.desc) q.set("desc", s.desc);
    if (s.height !== 220) q.set("height", String(s.height));
    if (s.width !== 880) q.set("width", String(s.width));
  } else if (s.form === "pill") {
    if (s.pill.label) q.set("label", s.pill.label);
    q.set("message", s.pill.message || "ok");
    if (s.pill.style !== "flat") q.set("style", s.pill.style);
  } else if (s.form === "strip") {
    q.set("icons", s.strip.icons.join(","));
    if (s.strip.perline !== 12) q.set("perline", String(s.strip.perline));
  } else if (s.form === "identity") {
    q.set("brand", s.identity.brand);
    if (s.identity.tagline) q.set("tagline", s.identity.tagline);
    if (s.type) q.set("type", s.type);
  } else if (s.form === "deploy") {
    if (s.deploy.service) q.set("service", s.deploy.service);
    if (s.pill.style !== "flat") q.set("style", s.pill.style);
  }
  const qs = q.toString();
  return `${BASE}/api/v1/mark/${s.form}${qs ? "?" + qs : ""}`;
}

function refresh(){
  const url = buildURL();
  document.getElementById("urlBox").value = url;
  document.getElementById("previewImg").src = url;
  document.querySelectorAll("#forms button").forEach(b => b.classList.toggle("active", b.dataset.f === state.form));
  renderControls();
}

function chips(values, selected, onClick, extraClass){
  return `<div class="chips">${values.map(v => {
    const on = v === selected ? " on" : "";
    return `<button type="button" class="chip${on}" data-v="${esc(v)}">${esc(v)}</button>`;
  }).join("")}</div>`;
}

function themePills(selected){
  return `<div class="chips">${THEMES.map(t => {
    const on = t === selected ? " on" : "";
    const orb = t ? `<span class="orb" style="background:${themeColor(t)}"></span>` : "";
    return `<button type="button" class="theme${on}" data-v="${esc(t)}">${orb}${t || "none"}</button>`;
  }).join("")}</div>`;
}

function themeColor(name){
  const m = { sylphx:"#D87000", cubeage:"#E03840", epiow:"#7C3AED", ozyrix:"#C9A227", kyle:"#38BDF8",
    dark:"#0D1117", light:"#E6EDF3", tokyonight:"#BB9AF7", dracula:"#BD93F9", nord:"#81A1C1",
    neon:"#00F5D4", ocean:"#00B4D8", sunset:"#FF6B35", forest:"#2D6A4F", github:"#1F6FEB",
    radical:"#FE428E", gruvbox:"#FABD2F", monokai:"#F92672" };
  return m[name] || "#58A6FF";
}

function surprise(){
  const p = RANDOM_PALETTES[Math.floor(Math.random()*RANDOM_PALETTES.length)];
  state.color = p; state.theme = "";
  refresh();
}

function renderControls(){
  const c = document.getElementById("controls");
  const s = state;
  let html = "";
  html += `<div class="group"><h3>Paint</h3>
    <div class="field"><label>Theme (palette)</label>${themePills(s.theme)}</div>
    <div class="field"><label>Color (overrides when no theme)</label>
      <div class="row"><input type="text" id="colorInput" placeholder="gradient | auto | hex | 0:EEFF00,100:a82da8" value="${esc(s.color)}" />
      <button type="button" class="chip" id="surpriseBtn">Surprise me</button></div></div>
    <div class="field"><label>Motion</label>${chips(ANIMS, s.animation, v => { state.animation = v; refresh(); })}</div>
    <div class="field"><label><input type="checkbox" id="creditCb" ${s.credit?"checked":""}/> soft “mark” watermark</label></div>
  </div>`;
  if (s.form === "hero") {
    html += `<div class="group"><h3>Art</h3>
      <div class="field"><label>Type</label>${chips(ART, s.type, v => { state.type = v; refresh(); })}</div>
      <div class="field"><label>Layout</label>${chips(LAYOUTS, s.layout, v => { state.layout = v; refresh(); })}</div>
    </div>
    <div class="group"><h3>Text</h3>
      <div class="field"><label>Title</label><textarea id="textInput">${esc(s.text)}</textarea></div>
      <div class="field"><label>Description</label><textarea id="descInput">${esc(s.desc)}</textarea></div>
      <div class="row">
        <div class="field"><label>Width</label><input type="number" id="widthInput" min="200" max="1600" value="${s.width}" /></div>
        <div class="field"><label>Height</label><input type="number" id="heightInput" min="40" max="900" value="${s.height}" /></div>
      </div>
    </div>`;
  } else if (s.form === "pill") {
    html += `<div class="group"><h3>Pill</h3>
      <div class="row"><div class="field"><label>Label</label><input type="text" id="pillLabel" value="${esc(s.pill.label)}" /></div>
      <div class="field"><label>Message</label><input type="text" id="pillMessage" value="${esc(s.pill.message)}" /></div></div>
      <div class="field"><label>Style</label>${chips(STYLES, s.pill.style, v => { state.pill.style = v; refresh(); })}</div>
    </div>`;
  } else if (s.form === "strip") {
    html += `<div class="group"><h3>Strip</h3>
      <div class="field"><label>Icons</label>${chips(ICONS, "", null)}<div class="chips" id="iconChips"></div></div>
      <div class="field"><label>Per line</label><input type="number" id="perlineInput" min="1" max="60" value="${s.strip.perline}" /></div>
    </div>`;
  } else if (s.form === "identity") {
    html += `<div class="group"><h3>Identity</h3>
      <div class="field"><label>Brand</label>${chips(BRANDS, s.identity.brand, v => { state.identity.brand = v; refresh(); })}</div>
      <div class="field"><label>Tagline (optional)</label><input type="text" id="taglineInput" value="${esc(s.identity.tagline)}" /></div>
      <div class="field"><label>Art background (optional)</label>${chips(["none", ...ART], s.type || "none", v => { state.type = v === "none" ? "" : v; refresh(); })}</div>
      <div class="field"><label>Width</label><input type="number" id="widthInput" min="280" max="1200" value="${s.width}" /></div>
    </div>`;
  } else if (s.form === "deploy") {
    html += `<div class="group"><h3>Deploy</h3>
      <div class="field"><label>Service</label><input type="text" id="serviceInput" value="${esc(s.deploy.service)}" /></div>
      <div class="field"><label>Style</label>${chips(STYLES, s.pill.style, v => { state.pill.style = v; refresh(); })}</div>
      <p style="font-size:.78rem;color:var(--muted)">“deployed on Sylphx” — the conversion mark.</p>
    </div>`;
  }
  c.innerHTML = html;

  // wire listeners
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("input", fn); };
  bind("colorInput", e => { state.color = e.target.value.trim(); if (state.color) state.theme = ""; refresh(); });
  bind("surpriseBtn", surprise);
  const cb = document.getElementById("creditCb"); if (cb) cb.addEventListener("change", e => { state.credit = e.target.checked; refresh(); });
  bind("textInput", e => { state.text = e.target.value; refresh(); });
  bind("descInput", e => { state.desc = e.target.value; refresh(); });
  bind("widthInput", e => { state.width = Number(e.target.value) || state.width; refresh(); });
  bind("heightInput", e => { state.height = Number(e.target.value) || state.height; refresh(); });
  bind("pillLabel", e => { state.pill.label = e.target.value; refresh(); });
  bind("pillMessage", e => { state.pill.message = e.target.value; refresh(); });
  bind("perlineInput", e => { state.strip.perline = Number(e.target.value) || 12; refresh(); });
  bind("taglineInput", e => { state.identity.tagline = e.target.value; refresh(); });
  bind("serviceInput", e => { state.deploy.service = e.target.value; refresh(); });
  const chipsSel = c.querySelectorAll(".chips .chip, .chips .theme");
  chipsSel.forEach(el => { if (!el.id) el.addEventListener("click", () => { el.dataset.v && null; }); });
  if (s.form === "strip") {
    const box = document.getElementById("iconChips");
    box.innerHTML = ICONS.map(i => `<button type="button" class="chip ${s.strip.icons.includes(i) ? "on" : ""}" data-i="${esc(i)}">${esc(i)}</button>`).join("");
    box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const i = b.dataset.i;
      const set = new Set(state.strip.icons);
      if (set.has(i)) set.delete(i); else set.add(i);
      state.strip.icons = [...set].slice(0, 60);
      refresh();
    }));
  }
}

function init(){
  document.getElementById("forms").innerHTML = FORMS.map(f =>
    `<button type="button" data-f="${f}">${f}</button>`).join("");
  document.querySelectorAll("#forms button").forEach(b => b.addEventListener("click", () => {
    state.form = b.dataset.f; refresh();
  }));
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const box = document.getElementById("urlBox");
    try { await navigator.clipboard.writeText(box.value); }
    catch { box.select(); document.execCommand("copy"); }
  });
  document.getElementById("baseLine").textContent = BASE;
  refresh();
}
init();
</script>
</body>
</html>
